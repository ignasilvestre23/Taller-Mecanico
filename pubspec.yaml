name: taller_app
description: Taller mecánico con autenticación facial.
publish_to: none
version: 1.1.0

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  camera: ^0.10.6
  google_mlkit_face_detection: ^0.11.0
  flutter_secure_storage: ^9.2.2
  tflite_flutter: ^0.11.0
  image: ^4.2.0
  http: ^1.2.2
  firebase_core: ^3.6.0
  cloud_firestore: ^5.4.4

flutter:
  uses-material-design: true
  assets:
    - assets/models/mobilefacenet.tflite
    
dev_dependencies:
  flutter_lints: ^5.0.0
